
#  Environment 
env:
  rom_path: "roms/pokemon_blue.gb"
  render_mode: "headless"          # "headless" | "human"
  frame_skip: 16                   # Number of frames to skip per action
  frame_stack: 4                   # Number of frames to stack as observations
  screen_width: 84
  screen_height: 84
  grayscale: true
  max_steps_per_episode: 10000 # ~5.5 minutes of gameplay at 60 fps / frame_skip 4

# DQN Hyperparameters 
dqn:
  learning_rate: 0.0001
  batch_size: 64
  gamma: 0.99                      # Discount factor
  epsilon_start: 1.0               # Initial exploration rate
  epsilon_end: 0.05                # Minimum exploration rate
  epsilon_decay: 500000            # Steps over which epsilon is annealed
  target_update_freq: 1000         # Steps between target network syncs
  replay_buffer_size: 30000
  min_replay_size: 10000           # Steps before training begins
  train_freq: 4                    # Train every N steps
  gradient_clip: 10.0              # Max gradient norm

# Neural Network 
network:
  conv_channels: [32, 64, 64]
  conv_kernels: [8, 4, 3]
  conv_strides: [4, 2, 1]
  fc_units: 512
  dueling_dqn: false               # Enable dueling network architecture

# Training Loop 
training:
  total_timesteps: 2000000
  num_episodes: 5000
  eval_freq: 50                    # Evaluate every N episodes
  eval_episodes: 5
  save_freq: 1                 # Save model every N episodes
  log_freq: 1                     # Log metrics every N episodes
  checkpoint_dir: "models/saved_models"
  log_dir: "experiments/training_logs"
  experiment_name: "dqn_pokemon_blue_v1"

# Reward Shaping 
rewards:
  explore_new_tile: 1.0
  explore_new_map: 5.0
  win_battle: 10.0
  level_up: 20.0
  earn_badge: 50.0
  defeat_trainer: 15.0
  lose_battle: -10.0
  pokemon_faint: -5.0
  step_penalty: -0.01
  heal_pokemon: 2.0

# Curiosity 
curiosity:
  enabled: false
  beta: 0.2                        # Weighting of intrinsic vs extrinsic reward

# PPO 
ppo:
  learning_rate: 0.00025
  n_steps: 2048
  batch_size: 64
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
